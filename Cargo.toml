[package]
name = "mothership"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Agent deployer: runs Claude Code agents for Linear agent sessions and Zulip conversations"
license = "Apache-2.0"
repository = "https://github.com/seongheum-choi/mothership"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
hmac = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "std"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
