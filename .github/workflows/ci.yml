name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check.sh
    runs-on: ubuntu-latest
    env:
      # The image the sandbox run tests in src/host/container.rs start; pinned so a new busybox
      # cannot change what they test.
      MOTHERSHIP_TEST_SANDBOX_IMAGE: busybox@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
      # GitHub's runner has Docker, not rootless nerdctl; the container flags are the same.
      MOTHERSHIP_TEST_CONTAINER_RUNTIME: docker
    steps:
      - uses: actions/checkout@v7
      # Installs the Rust toolchain pinned in mise.toml, so CI and local builds use the same compiler.
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - run: docker pull "$MOTHERSHIP_TEST_SANDBOX_IMAGE"
      - run: scripts/check.sh

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The scan covers every commit a push or pull request introduces, so it needs history.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Findings fail the job and show in its summary; PR comments would need write access.
          GITLEAKS_ENABLE_COMMENTS: false
