name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check.sh
    runs-on: ubuntu-latest
    env:
      # The image the sandbox run tests in src/host/container.rs start; pinned so a new busybox
      # cannot change what they test.
      MOTHERSHIP_TEST_SANDBOX_IMAGE: busybox:1.37@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    steps:
      - uses: actions/checkout@v7
      # Installs the Rust toolchain pinned in mise.toml, so CI and local builds use the same compiler.
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - run: docker pull "$MOTHERSHIP_TEST_SANDBOX_IMAGE"
      - run: scripts/check.sh

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The scan covers every commit a push or pull request introduces, so it needs history.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Findings fail the job and show in its summary; PR comments would need write access.
          GITLEAKS_ENABLE_COMMENTS: false
